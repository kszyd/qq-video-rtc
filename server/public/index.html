<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频通话 · 管理端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6fb; color: #1f2733; height: 100vh; overflow: hidden; }
  .wrap { display: flex; height: 100vh; }
  /* 左侧面板 */
  .side { width: 320px; background: #ffffff; border-right: 1px solid #e3e8f0; display: flex; flex-direction: column; box-shadow: 2px 0 12px rgba(20,40,90,.04); }
  .brand { padding: 20px 20px 12px; border-bottom: 1px solid #eef1f7; }
  .brand h1 { font-size: 18px; color: #1f2733; }
  .brand p { font-size: 12px; color: #8a94a6; margin-top: 3px; }
  .login { padding: 14px 20px; border-bottom: 1px solid #eef1f7; }
  .login input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #d5dce8; background: #fff; color: #1f2733; font-size: 14px; margin-bottom: 8px; }
  .login input:focus { border-color: #3d6bf5; outline: none; box-shadow: 0 0 0 3px rgba(61,107,245,.12); }
  .login button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #3d6bf5; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .login button:disabled { background: #b6c4ee; cursor: not-allowed; }
  .status { padding: 10px 20px; font-size: 13px; color: #5a6478; display: flex; align-items: center; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .status .on { background: #22c55e; } .status .off { background: #ef4444; }
  .tabs { display: flex; border-bottom: 1px solid #eef1f7; }
  .tabs div { flex: 1; text-align: center; padding: 12px; font-size: 14px; color: #8a94a6; cursor: pointer; font-weight: 500; }
  .tabs div.active { color: #3d6bf5; border-bottom: 2px solid #3d6bf5; background: #f7f9ff; }
  .panel { flex: 1; overflow-y: auto; padding: 12px; }
  .contact { display: flex; align-items: center; padding: 11px 12px; border-radius: 10px; margin-bottom: 7px; background: #f7f9fc; border: 1px solid #eef1f7; }
  .contact .av { width: 38px; height: 38px; border-radius: 50%; background: #e4ebfb; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #3d6bf5; font-weight: 600; margin-right: 11px; flex-shrink: 0; }
  .contact .info { flex: 1; min-width: 0; }
  .contact .info .n { font-size: 14px; font-weight: 600; color: #1f2733; }
  .contact .info .s { font-size: 12px; color: #8a94a6; margin-top: 2px; }
  .contact .badge { padding: 4px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .contact .badge.on { background: #e5f8ec; color: #16a34a; }
  .contact .badge.off { background: #f0f2f6; color: #9aa2b0; }
  .record { padding: 11px 12px; border-radius: 10px; margin-bottom: 7px; background: #f7f9fc; border: 1px solid #eef1f7; font-size: 13px; }
  .record .who { font-weight: 600; color: #1f2733; }
  .record .meta { color: #8a94a6; font-size: 12px; margin-top: 4px; }
  .record .st { float: right; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .st.active { background: #fff4e0; color: #b45309; }
  .st.ended { background: #e5f8ec; color: #16a34a; }
  .st.missed { background: #fee2e2; color: #dc2626; }
  .st.rejected { background: #f0f2f6; color: #6b7280; }
  .empty { text-align: center; color: #aab2c0; padding: 34px 0; font-size: 13px; }
  /* 右侧统计区 */
  .main { flex: 1; display: flex; flex-direction: column; padding: 24px; overflow-y: auto; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .card { flex: 1; background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(20,40,90,.04); }
  .card .num { font-size: 28px; font-weight: 700; color: #3d6bf5; }
  .card .lab { font-size: 13px; color: #8a94a6; margin-top: 4px; }
  .main h2 { font-size: 16px; margin-bottom: 12px; color: #1f2733; }
  .live { background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 18px; }
  .live-item { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid #f2f4f8; font-size: 14px; }
  .live-item:last-child { border-bottom: 0; }
  .live-item .gr { flex: 1; }
  .live-item .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <div class="brand">
      <h1>视频通话 · 管理端</h1>
      <p>信令服务控制台 / 在线监控 / 通话记录</p>
    </div>
    <div class="login">
      <input id="uid" placeholder="管理账号（如 admin）">
      <button id="btnLogin">连接服务器</button>
    </div>
    <div class="status"><span class="dot off" id="dot"></span><span id="statusText">未连接</span></div>
    <div class="tabs">
      <div id="tabOnline" class="active">在线用户</div>
      <div id="tabCalls">全部通话</div>
    </div>
    <div id="panelOnline" class="panel"></div>
    <div id="panelCalls" class="panel hide"></div>
  </div>
  <div class="main">
    <div class="stats">
      <div class="card"><div class="num" id="stTotal">0</div><div class="lab">累计用户</div></div>
      <div class="card"><div class="num" id="stOnline">0</div><div class="lab">当前在线</div></div>
      <div class="card"><div class="num" id="stCalls">0</div><div class="lab">通话次数</div></div>
      <div class="card"><div class="num" id="stActive">0</div><div class="lab">进行中</div></div>
    </div>
    <div class="live">
      <h2>实时在线监测</h2>
      <div id="liveList"><div class="empty">暂无在线设备</div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null;
let myId = null;

function setStatus(text, on) {
  $('statusText').textContent = text;
  $('dot').className = 'dot ' + (on ? 'on' : 'off');
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  myId = $('uid').value.trim();
  if (!myId) { alert('请输入管理账号'); return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/`);
  ws.onopen = () => send({ type: 'register', id: myId, name: '管理员' });
  ws.onclose = () => setStatus('连接断开', false);
  ws.onerror = () => setStatus('连接错误', false);
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } handleMsg(m); };
  $('btnLogin').disabled = true;
  setStatus('连接中…', false);
}

function handleMsg(m) {
  switch (m.type) {
    case 'registered': setStatus(`已连接 · 管理账号: ${m.name}`, true); break;
    case 'contacts': renderOnline(m.list); break;
    case 'calls': renderCalls(m.list); break;
    case 'kicked': alert('该账号已在其他设备登录'); break;
    case 'error': alert(m.message); break;
  }
}

function renderOnline(list) {
  const total = list.length;
  const onlineN = list.filter(u => u.online).length;
  $('stTotal').textContent = total;
  $('stOnline').textContent = onlineN;

  // 在线用户面板
  $('panelOnline').innerHTML = '';
  if (!list.length) { $('panelOnline').innerHTML = '<div class="empty">暂无注册用户</div>'; return; }
  list.forEach(u => {
    const d = document.createElement('div');
    d.className = 'contact';
    const av = (u.name || u.id).charAt(0).toUpperCase();
    d.innerHTML = `<div class="av">${av}</div>
      <div class="info">
        <div class="n">${esc(u.name)} ${u.id===myId?'<span style="color:#8a94a6;font-weight:400">(我)</span>':''}</div>
        <div class="s">ID: ${esc(u.id)}</div>
      </div>
      <span class="badge ${u.online?'on':'off'}">${u.online?'在线':'离线'}</span>`;
    $('panelOnline').appendChild(d);
  });

  // 右侧实时在线列表（只看在线）
  $('liveList').innerHTML = '';
  const onlines = list.filter(u => u.online);
  if (!onlines.length) { $('liveList').innerHTML = '<div class="empty">暂无在线设备</div>'; return; }
  onlines.forEach(u => {
    const d = document.createElement('div');
    d.className = 'live-item';
    d.innerHTML = `<span class="dot" style="background:#22c55e"></span>
      <div class="gr"><strong>${esc(u.name)}</strong> <span style="color:#8a94a6">(${esc(u.id)})</span></div>
      <span style="color:#16a34a">在线</span>`;
    $('liveList').appendChild(d);
  });
}

function renderCalls(list) {
  $('stCalls').textContent = list.length;
  $('stActive').textContent = list.filter(c => c.status === 'active').length;

  $('panelCalls').innerHTML = '';
  if (!list.length) { $('panelCalls').innerHTML = '<div class="empty">暂无通话记录</div>'; return; }
  list.forEach(c => {
    const st = { active:'通话中', ended:'已结束', missed:'未接', rejected:'已拒' }[c.status] || c.status;
    const who = c.type === 'group'
      ? `[群聊] ${esc(c.caller)} → 群成员`
      : `${esc(c.caller)} → ${esc(c.callee)}`;
    const dur = c.duration ? ` · ${(c.duration/1000).toFixed(0)}秒` : '';
    const d = document.createElement('div');
    d.className = 'record';
    d.innerHTML = `<span class="st ${c.status}">${st}</span>
      <div class="who">${who}</div>
      <div class="meta">${new Date(c.start).toLocaleString()}${dur}</div>`;
    $('panelCalls').appendChild(d);
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 管理端请求全部通话记录（不传 self，服务端返回全部）
function requestAllCalls() {
  if (ws && ws.readyState === 1) send({ type: 'calls' });
}

$('btnLogin').onclick = connect;
$('uid').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('tabOnline').onclick = () => { $('tabOnline').classList.add('active'); $('tabCalls').classList.remove('active'); $('panelOnline').classList.remove('hide'); $('panelCalls').classList.add('hide'); };
$('tabCalls').onclick = () => { $('tabCalls').classList.add('active'); $('tabOnline').classList.remove('active'); $('panelCalls').classList.remove('hide'); $('panelOnline').classList.add('hide'); requestAllCalls(); };

// 定时刷新全部记录
setInterval(requestAllCalls, 8000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>视频通话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1220; color: #e8eaf2; height: 100vh; overflow: hidden; }
  .wrap { display: flex; height: 100vh; }
  /* 左侧面板 */
  .side { width: 300px; background: #171a2b; border-right: 1px solid #262b42; display: flex; flex-direction: column; }
  .side h2 { padding: 16px 16px 8px; font-size: 15px; color: #8b93b8; letter-spacing: 1px; }
  .login { padding: 8px 16px 12px; }
  .login input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #2c3350; background: #1e2336; color: #e8eaf2; font-size: 14px; margin-bottom: 8px; }
  .login button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #3d6bf5; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .login button:disabled { background: #2a3rff; background: #2a3050; cursor: not-allowed; }
  .status { padding: 4px 16px 8px; font-size: 12px; color: #6b7399; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status .on { background: #22c55e; } .status .off { background: #ef4444; }
  .tabs { display: flex; border-bottom: 1px solid #262b42; }
  .tabs div { flex: 1; text-align: center; padding: 10px; font-size: 13px; color: #8b93b8; cursor: pointer; }
  .tabs div.active { color: #3d6bf5; border-bottom: 2px solid #3d6bf5; }
  .panel { flex: 1; overflow-y: auto; padding: 10px; }
  .contact { display: flex; align-items: center; padding: 10px; border-radius: 8px; margin-bottom: 6px; background: #1e2336; }
  .contact .av { width: 36px; height: 36px; border-radius: 50%; background: #2c3350; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #9aa3c7; margin-right: 10px; flex-shrink: 0; }
  .contact .info { flex: 1; min-width: 0; }
  .contact .info .n { font-size: 14px; }
  .contact .info .s { font-size: 12px; color: #6b7399; }
  .contact .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 2px; display: inline-block; }
  .contact .call { padding: 7px 14px; border: 0; border-radius: 8px; background: #22c55e; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .record { padding: 10px; border-radius: 8px; margin-bottom: 6px; background: #1e2336; font-size: 13px; }
  .record .t { color: #8b93b8; font-size: 12px; margin-top: 4px; }
  .empty { text-align: center; color: #4a5072; padding: 30px 0; font-size: 13px; }
  /* 右侧视频区 */
  .video { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; }
  .local { position: absolute; right: 16px; top: 16px; width: 180px; height: 240px; border: 2px solid #3d6bf5; border-radius: 10px; object-fit: cover; background: #1e2336; z-index: 10; }
  .remote { width: 100%; height: 100%; object-fit: contain; }
  .idle { color: #4a5072; font-size: 16px; text-align: center; }
  /* 来电/通话浮层 */
  .overlay { position: fixed; inset: 0; background: rgba(10,12,25,.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .overlay .card { background: #1e2336; padding: 24px 30px; border-radius: 14px; text-align: center; min-width: 240px; }
  .overlay h3 { margin-bottom: 6px; }
  .overlay p { color: #8b93b8; font-size: 13px; margin-bottom: 18px; }
  .btnrow { display: flex; gap: 12px; justify-content: center; }
  .btn { padding: 10px 22px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.green { background: #22c55e; color: #fff; } .btn.red { background: #ef4444; color: #fff; } .btn.gray { background: #2c3350; color: #e8eaf2; }
  .hide { display: none; }
  .tip { position: absolute; left: 16px; top: 16px; color: #8b93b8; font-size: 12px; background: rgba(15,18,32,.7); padding: 6px 10px; border-radius: 6px; z-index: 10; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h2>视频通话 · 管理端</h2>
    <div class="login">
      <input id="uid" placeholder="你的ID（如 alice）">
      <input id="uname" placeholder="昵称（可选）">
      <button id="btnLogin">连接</button>
    </div>
    <div class="status"><span class="dot off" id="dot"></span><span id="statusText">未连接</span></div>
    <div class="tabs">
      <div id="tabContacts" class="active">联系人</div>
      <div id="tabCalls">通话记录</div>
    </div>
    <div id="panelContacts" class="panel"></div>
    <div id="panelCalls" class="panel hide"></div>
  </div>
  <div class="video">
    <div class="tip" id="tip"></div>
    <video id="remote" class="remote" autoplay playsinline></video>
    <video id="local" class="local" autoplay playsinline muted></video>
    <div class="idle" id="idle">登录后，从左侧联系人拨号<br>两个标签页各登录一个ID即可对打</div>
  </div>
</div>

<!-- 来电浮层 -->
<div class="overlay hide" id="incomingOv">
  <div class="card">
    <h3 id="incomingWho">来电</h3>
    <p>邀请你进行视频通话</p>
    <div class="btnrow">
      <button class="btn green" id="btnAccept">接听</button>
      <button class="btn red" id="btnReject">拒接</button>
    </div>
  </div>
</div>

<!-- 通话中浮层 -->
<div class="overlay hide" id="callOv">
  <div class="card">
    <h3 id="callWho">通话中</h3>
    <div class="btnrow">
      <button class="btn red" id="btnHangup">挂断</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null;
let myId = null;
let myName = null;
let turnCfg = { url: null, username: null, credential: null };
let contacts = [];
let calls = [];
let pc = null;          // RTCPeerConnection
let callState = 'idle'; // idle | calling | incoming | active
let pendingCaller = null;
let currentPeer = null; // 对端id
let localStream = null;
let iceQueue = [];      // active之前到达的ICE候选

const iceServers = () => {
  const list = [{ urls: 'stun:stun.l.google.com:19302' }];
  if (turnCfg.url) list.push({ urls: turnCfg.url, username: turnCfg.username, credential: turnCfg.credential });
  return { iceServers: list };
};

function setStatus(text, on) {
  $('statusText').textContent = text;
  $('dot').className = 'dot ' + (on ? 'on' : 'off');
}

// 修复服务端下发的 127.0.0.1/localhost -> 当前页面host，这样真机访问也能连对
function fixHost(u) {
  if (!u) return u;
  return u.replace(/127\.0\.0\.1|localhost/g, location.hostname);
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  myId = $('uid').value.trim();
  if (!myId) { alert('请输入ID'); return; }
  myName = $('uname').value.trim() || myId;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/`;
  ws = new WebSocket(url);
  ws.onopen = () => { send({ type: 'register', id: myId, name: myName }); };
  ws.onclose = () => { setStatus('连接断开', false); };
  ws.onerror = () => { setStatus('连接错误', false); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    handleMsg(m);
  };
  $('btnLogin').disabled = true;
  setStatus('连接中…', false);
}

function handleMsg(m) {
  switch (m.type) {
    case 'registered':
      turnCfg = { url: fixHost(m.serverInfo.turn.url), username: m.serverInfo.turn.username, credential: m.serverInfo.turn.credential };
      setStatus(`已登录: ${m.name}`, true);
      $('tip').textContent = '信令: ' + location.host + '  TURN: ' + turnCfg.url;
      $('idle').textContent = '已登录，从左侧联系人拨号';
      break;
    case 'contacts': renderContacts(m.list); break;
    case 'incoming': onIncoming(m); break;
    case 'calling': setStatus('正在呼叫…', true); break;
    case 'callee-offline': alert('对方离线'); resetToIdle(); break;
    case 'accepted': onAccepted(m); break;
    case 'rejected': alert('对方拒接'); resetToIdle(); break;
    case 'peer-ready': onPeerReady(m); break;
    case 'hangup': onRemoteHangup(m); break;
    case 'sdp': onRemoteSdp(m); break;
    case 'ice': onRemoteIce(m); break;
    case 'calls': renderCalls(m.list); break;
    case 'kicked': alert('该账号已在其他设备登录'); break;
    case 'error': alert(m.message); break;
  }
}

// ---------- 联系人 / 通话记录 ----------
function renderContacts(list) {
  contacts = list;
  $('panelContacts').innerHTML = '';
  if (!list.length) { $('panelContacts').innerHTML = '<div class="empty">暂无联系人</div>'; return; }
  list.forEach(u => {
    const d = document.createElement('div');
    d.className = 'contact';
    const av = (u.name || u.id).charAt(0).toUpperCase();
    d.innerHTML = `<div class="av">${av}</div>
      <div class="info">
        <div class="n">${esc(u.name)} <span class="dot" style="background:${u.online?'#22c55e':'#4a5072'}"></span></div>
        <div class="s">${esc(u.id)}${u.id===myId?' (我)':''}${u.online?' · 在线':' · 离线'}</div>
      </div>
      ${u.id===myId?'':`<button class="call" onclick="callUser('${u.id}')">呼叫</button>`}`;
    $('panelContacts').appendChild(d);
  });
}
function renderCalls(list) {
  calls = list;
  $('panelCalls').innerHTML = '';
  if (!list.length) { $('panelCalls').innerHTML = '<div class="empty">暂无通话记录</div>'; return; }
  list.forEach(c => {
    const other = c.caller === myId ? c.callee : c.caller;
    const dir = c.caller === myId ? '→' : '←';
    const st = { active:'通话中', missed:'未接', rejected:'已拒', ended:'已结束' }[c.status] || c.status;
    const d = document.createElement('div');
    d.className = 'record';
    d.innerHTML = `${dir} ${esc(other)} <span style="color:#8b93b8">${st}</span>
      <div class="t">${new Date(c.start).toLocaleString()}</div>`;
    $('panelCalls').appendChild(d);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 拨号 / 接听 ----------
function callUser(id) {
  if (!pc) createPC();
  currentPeer = id;
  callState = 'calling';
  send({ type: 'call', callee: id });
  $('callWho').textContent = '正在呼叫 ' + id;
  $('callOv').classList.remove('hide');
}
function onIncoming(m) {
  if (callState !== 'idle') { send({ type: 'reject', caller: m.caller }); return; }
  pendingCaller = m.caller;
  callState = 'incoming';
  $('incomingWho').textContent = m.callerName || m.caller;
  $('incomingOv').classList.remove('hide');
}
function accept() {
  $('incomingOv').classList.add('hide');
  if (!pc) createPC();
  currentPeer = pendingCaller;
  callState = 'active';
  send({ type: 'accept', caller: pendingCaller });
  $('callWho').textContent = '与 ' + pendingCaller + ' 通话中';
  $('callOv').classList.remove('hide');
  startCaller(); // 本端作为answerer
}
function reject() {
  $('incomingOv').classList.add('hide');
  send({ type: 'reject', caller: pendingCaller });
  callState = 'idle'; pendingCaller = null;
}

// ---------- WebRTC ----------
function createPC() {
  pc = new RTCPeerConnection(iceServers());
  pc.onicecandidate = e => { if (e.candidate && currentPeer) send({ type: 'ice', to: currentPeer, candidate: e.candidate }); };
  pc.ontrack = e => { $('remote').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') { /* 静默 */ } };
  return pc;
}
async function getUserMedia() {
  if (localStream) return localStream;
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  $('local').srcObject = localStream;
  return localStream;
}
async function startCaller() {
  const stream = await getUserMedia();
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: 'sdp', to: currentPeer, sdp: pc.localDescription });
  flushIce();
}
async function onAccepted(m) {
  callState = 'active';
  currentPeer = m.callee;
  $('callWho').textContent = '与 ' + m.callee + ' 通话中';
  startCaller();
}
function onPeerReady(m) {
  // answerer收到，准备接收offer
  callState = 'active';
}
async function onRemoteSdp(m) {
  currentPeer = m.from;
  if (!pc) createPC();
  await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));
  if (m.sdp.type === 'offer') {
    const stream = await getUserMedia();
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    send({ type: 'sdp', to: m.from, sdp: pc.localDescription });
  }
  flushIce();
}
function onRemoteIce(m) {
  if (!pc || !pc.remoteDescription) { iceQueue.push(m.candidate); return; }
  pc.addIceCandidate(new RTCIceCandidate(m.candidate)).catch(()=>{});
}
function flushIce() {
  while (iceQueue.length) { pc.addIceCandidate(new RTCIceCandidate(iceQueue.shift())).catch(()=>{}); }
}

// ---------- 挂断 ----------
function hangup() {
  if (currentPeer) send({ type: 'hangup', peer: currentPeer });
  teardown();
}
function onRemoteHangup(m) {
  alert('对方挂断');
  teardown();
}
function teardown() {
  $('callOv').classList.add('hide');
  $('incomingOv').classList.add('hide');
  if (pc) { try { pc.close(); } catch(e){} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $('local').srcObject = null; $('remote').srcObject = null;
  currentPeer = null; pendingCaller = null; iceQueue = [];
  callState = 'idle';
  $('idle').textContent = '已登录，从左侧联系人拨号';
  $('callWho').textContent = '';
  setStatus(myId ? `已登录: ${myName}` : '未连接', !!myId);
  send({ type: 'calls', self: myId });
}
function resetToIdle() { teardown(); }

// ---------- UI绑定 ----------
$('btnLogin').onclick = connect;
$('uid').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('tabContacts').onclick = () => { $('tabContacts').classList.add('active'); $('tabCalls').classList.remove('active'); $('panelContacts').classList.remove('hide'); $('panelCalls').classList.add('hide'); };
$('tabCalls').onclick = () => { $('tabCalls').classList.add('active'); $('tabContacts').classList.remove('active'); $('panelCalls').classList.remove('hide'); $('panelContacts').classList.add('hide'); if (ws && ws.readyState===1) send({ type: 'calls', self: myId }); };
$('btnAccept').onclick = accept;
$('btnReject').onclick = reject;
$('btnHangup').onclick = hangup;
</script>
</body>
</html>
